name: edara_admin_panel
description: Admin web panel for Edara Hub - manage users and events
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^3.8.1
  cloud_firestore: ^5.5.2
  firebase_auth: ^5.3.4
  firebase_storage: ^12.3.8
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  intl: ^0.19.0
  file_picker: ^8.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
